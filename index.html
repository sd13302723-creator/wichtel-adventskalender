<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wichtel Willi — Adventskalender</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 20px;
      background: #141c24;
      color: #f7f4ec;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 500px;
      background: #1f2b38;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .badge {
      display: inline-block;
      background: #c89d54;
      color: #141c24;
      font-weight: 700;
      font-size: 13px;
      padding: 5px 11px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; margin: 0 0 10px; line-height: 1.3; }
    p { color: #dce3ea; line-height: 1.55; margin: 0 0 14px; }
    .task {
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .nav {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #e0b15e;
      color: #141c24;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    button.secondary {
      background: rgba(255,255,255,0.12);
      color: #f7f4ec;
    }
    .progress { font-size: 13px; color: #b8c4d0; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card" id="app"></div>

  <script>
    const DAYS = {
      1: {
        title: "Tag 1: Kennenlernen",
        msg: "Hallo! Ich bin Wichtel Willi. Ich komme direkt aus dem verschneiten Wald, um vierundzwanzig gemütliche Tage mit euch zu verbringen. Wie schön, dass wir uns haben!",
        task: "Drückt euch einmal ganz fest – zwanzig Sekunden lang – und spürt ein kleines Weihnachtswunder."
      },
      2: {
        title: "Tag 2: Gute Worte",
        msg: "Heute habe ich meinen Beutel mit den guten Worten verloren. Helft ihr mir, ihn wieder aufzufüllen?",
        task: "Jeder sagt einem anderen Familienmitglied ein ehrliches, herzliches Kompliment."
      },
      3: {
        title: "Tag 3: Lustiges Foto",
        msg: "Ich brauche Helfer für das lustigste Weihnachtsfoto!",
        task: "Macht zusammen ein lustiges Familien-Selfie."
      },
      4: {
        title: "Tag 4: Geheimer Helfer",
        msg: "Heute wird jeder von euch zu einem geheimen Helfer.",
        task: "Tut heute unbemerkt etwas Gutes für jemand anderen."
      },
      5: {
        title: "Tag 5: Wichtel-Tanz",
        msg: "In meinem Wald lösen wir vieles mit einem fröhlichen Tanz!",
        task: "Tanzt zwei Minuten lang zusammen zu eurem Lieblingslied."
      },
      6: {
        title: "Tag 6: Schöne Erinnerung",
        msg: "Erzählt mir eine Geschichte, an die eure Familie besonders gern zurückdenkt.",
        task: "Erinnert euch zusammen an einen lustigen Moment aus der Familie."
      },
      7: {
        title: "Tag 7: Tag der Dankbarkeit",
        msg: "Manchmal wohnt das Glück in ganz einfachen Dingen.",
        task: "Jeder nennt drei Dinge, für die er heute dankbar ist."
      },
      8: {
        title: "Tag 8: Lachtherapie",
        msg: "Oh nein! Ich habe aus Versehen eine viel zu ernste Bonbon-Sorte genascht!",
        task: "Jeder erzählt einen lustigen Witz."
      },
      9: {
        title: "Tag 9: Mission Ordnung",
        msg: "In meiner kleinen Ecke ist heute ganz schön was durcheinandergekommen!",
        task: "Räumt gemeinsam eine kleine Ecke zu Hause auf."
      },
      10: {
        title: "Tag 10: Weihnachtskünstler",
        msg: "Ich wünsche mir ein neues Kunstwerk für meine Sammlung.",
        task: "Malt einen Tannenbaum auf eine ganz besondere, ungewöhnliche Weise."
      },
      11: {
        title: "Tag 11: Lieber Brief",
        msg: "Freundliche Worte fliegen manchmal noch weiter als Schneeflocken.",
        task: "Schreibt einem lieben Menschen eine kleine Nachricht."
      },
      12: {
        title: "Tag 12: Geheimnis des Glücks",
        msg: "Heute gehen wir gemeinsam auf die Suche nach dem Glück.",
        task: "Jeder erzählt, was ihn gerade glücklich macht."
      },
      13: {
        title: "Tag 13: Familien-Lachen",
        msg: "Zeit für die Weltmeisterschaft der lustigen Gesichter!",
        task: "Macht einen kleinen Grimassen-Wettbewerb."
      },
      14: {
        title: "Tag 14: Warmer Abend",
        msg: "Heute empfehle ich eine besonders gemütliche Auszeit.",
        task: "Trinkt zusammen Tee oder Kakao und genießt die Ruhe."
      },
      15: {
        title: "Tag 15: Musiktag",
        msg: "Meine Ohren haben heute Lust auf eure Lieblingsmusik!",
        task: "Stellt zusammen eine kleine Familien-Playlist zusammen."
      },
      16: {
        title: "Tag 16: Schatzsuche",
        msg: "Ich habe eine kleine Überraschung für euch versteckt.",
        task: "Sucht den kleinen Schatz, den die Eltern vorher versteckt haben."
      },
      17: {
        title: "Tag 17: Wunsch-Tag",
        msg: "Jeder Mensch trägt einen schönen Wunsch im Herzen.",
        task: "Teilt einen kleinen Wunsch miteinander."
      },
      18: {
        title: "Tag 18: Kompliment-Runde",
        msg: "Heute sind herzliche Worte kostbarer als Gold.",
        task: "Macht jedem in der Familie ein liebes Kompliment."
      },
      19: {
        title: "Tag 19: Familienkino",
        msg: "Ich habe schon mal gedanklich Popcorn bereitgestellt!",
        task: "Schaut zusammen einen schönen Familienfilm."
      },
      20: {
        title: "Tag 20: Zauberhaftes Lachen",
        msg: "Schafft ihr es, alle in dreißig Sekunden zum Lachen zu bringen?",
        task: "Kleines Lachen-Wettspiel für dreißig Sekunden."
      },
      21: {
        title: "Tag 21: Tag der kleinen Wunder",
        msg: "Heute dürfen wir ein kleines Wunder verschenken.",
        task: "Macht jemandem einfach so eine Freude."
      },
      22: {
        title: "Tag 22: Familiengeschichte",
        msg: "Ich höre so gern Geschichten von früher.",
        task: "Die Eltern erzählen eine Geschichte aus ihrer eigenen Kindheit."
      },
      23: {
        title: "Tag 23: Vorfreude",
        msg: "Das Fest ist schon ganz nah!",
        task: "Schmückt gemeinsam ein Zimmer oder den Baum."
      },
      24: {
        title: "Tag 24: Finale",
        msg: "Wir haben vierundzwanzig wunderbare Tage zusammen erlebt. Danke für das Lachen, die guten Taten, die Umarmungen und eure Herzlichkeit. Frohe Weihnachten!",
        task: "Jeder erzählt, welcher Tag ihm am besten gefallen hat."
      }
    };

    const STORAGE_KEY = "wichtel_adventskalender_seen_v1";

    function getDay() {
      const params = new URLSearchParams(window.location.search);
      const d = parseInt(params.get("day") || "1", 10);
      return Number.isNaN(d) ? 1 : Math.min(Math.max(d, 1), 24);
    }

    function getSeen() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function markSeen(day) {
      try {
        const seen = new Set(getSeen());
        seen.add(day);
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...seen]));
        return seen.size;
      } catch (e) {
        return 1;
      }
    }

    function goDay(day) {
      const bounded = Math.min(Math.max(day, 1), 24);
      const url = new URL(window.location.href);
      url.searchParams.set("day", String(bounded));
      window.location.href = url.toString();
    }

    function render() {
      const day = getDay();
      const countSeen = markSeen(day);
      const item = DAYS[day];
      const app = document.getElementById("app");

      app.innerHTML = `
        <span class="badge">Tag ${day} von 24</span>
        <h1>${item.title}</h1>
        <p>„${item.msg}“</p>
        <div class="task">
          <strong>Aufgabe:</strong><br/>
          <span>${item.task}</span>
        </div>
        <div class="nav">
          ${day > 1 ? `<button class="secondary" onclick="goDay(${day - 1})">← Tag ${day - 1}</button>` : ""}
          ${day < 24 ? `<button onclick="goDay(${day + 1})">Tag ${day + 1} →</button>` : ""}
        </div>
        <div class="progress">Geöffnete Tage auf diesem Gerät: ${countSeen} / 24</div>
      `;
    }

    render();
  </script>
</body>
</html>
